spring:
  application:
    name: yourbookshelf

  datasource:
    url: jdbc:h2:file:./JavaApl/data/bookshelfdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
    driverClassName: org.h2.Driver
    username: admin
    password: pass

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 1

deepl:
    api-key: ${DEEPL_API_KEY}
    base-url: https://api-free.deepl.com

